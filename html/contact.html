
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - RSL Watch Store</title>

    <!-- Bootstrap  -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Navbar  -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand text-warning fw-bold" href="#">
                RSL Watch Store
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./product.html">
                            Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./about.html">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="./contact.html">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Contact Section  -->

    <section class="py-5 bg-black text-white min-vh-100">

        <div class="container">

            <div class="text-center mb-5">

                <h1 class="text-warning fw-bold">
                    Contact Us
                </h1>

                <p>
                    Get in touch with RSL Watch Store
                </p>

            </div>


            <div class="row justify-content-center">

                <div class="col-lg-6">

                    <form>

                        <!-- Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                class="form-control"
                                placeholder="Enter your name">

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                class="form-control"
                                placeholder="Enter your email">

                        </div>


                        <!-- Message -->

                        <div class="mb-3">

                            <label class="form-label">
                                Message
                            </label>

                            <textarea class="form-control"
                                rows="5"
                                placeholder="Write your message"></textarea>

                        </div>


                        <!-- Button -->

                        <button type="submit"
                            class="btn btn-warning w-100">

                            Send Message

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </section>

 <!-- Footer  -->

<footer class="footer-section bg-dark text-light py-5">

        <!-- Footer Menu -->

        <ul class="nav justify-content-center pb-3 mb-3">

                </a>
            </li>

        </ul>


        <hr class="border-secondary">


        <p class="text-center text-light mt-4">

            © 2026 RSL Watch Store | All Rights Reserved

        </p>

    </div>

</footer>
